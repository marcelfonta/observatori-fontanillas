name: Diagnòstic segur de credencials de YouTube

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-auth-diagnostics
  cancel-in-progress: false

jobs:
  validate-auth:
    name: Verifica OAuth sense publicar
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_AUTH_CHECK_ONLY: 'true'
    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v7

      - name: Configura Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Comprova les credencials sense crear cap vídeo
        run: node scripts/youtube-upload.mjs
