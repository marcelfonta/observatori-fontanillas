name: Qualitat del projecte

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      social_preview:
        description: Genera vídeos i imatges amb dades actuals sense publicar
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  social-preview:
    name: Prova social sense enviaments (${{ matrix.slot }})
    if: github.event_name == 'workflow_dispatch' && inputs.social_preview == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot: [mati, vespre]
    env:
      SHORT_SLOT: ${{ matrix.slot }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pnpm exec playwright install --with-deps chromium
      - name: Recull dades i renderitza sense secrets socials
        run: |
          node scripts/social-production.mjs
          node scripts/youtube-music.mjs
          node scripts/social-pilot/render.mjs --production
          node scripts/social-production-preview.mjs
          ffprobe -v error -show_entries format=duration,size -of json build/youtube-short/short.mp4
      - uses: actions/upload-artifact@v7
        with:
          name: social-v5-${{ matrix.slot }}-NO-PUBLICAT
          path: |
            build/youtube-short/short.mp4
            build/youtube-short/scene-*.png
            build/youtube-short/image-*.png
            build/youtube-short/validation.json
          retention-days: 7
  tests:
    name: Proves Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v7

      - name: Configura pnpm
        uses: pnpm/action-setup@v6

      - name: Configura Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instal·la dependències verificades
        run: pnpm install --frozen-lockfile

      - name: Executa les comprovacions
        run: npm run check
      - name: Instal·la Chromium per comprovar dissenys
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-dejavu-core
      - name: Comprova mòbil i targetes amb dades de prova
        run: pnpm test:browser
      - name: Conserva captures i informe visual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-checks
          path: |
            test-results/
            playwright-report/
          retention-days: 7
