name: Qualitat del projecte

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Proves Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v7

      - name: Configura pnpm
        uses: pnpm/action-setup@v6

      - name: Configura Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instal·la dependències verificades
        run: pnpm install --frozen-lockfile

      - name: Executa les comprovacions
        run: npm run check
      - name: Instal·la Chromium per comprovar dissenys
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-dejavu-core
      - name: Comprova mòbil i targetes amb dades de prova
        run: pnpm test:browser
      - name: Conserva captures i informe visual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-checks
          path: |
            test-results/
            playwright-report/
          retention-days: 7
