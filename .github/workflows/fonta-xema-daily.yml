name: Fonta · contrast regional XEMA diari privat

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pla sense escriptures o captura privada real
        type: choice
        options: [plan, run]
        default: plan
  schedule:
    # Forecast for tomorrow is frozen before the target day; UTC, not local time.
    - cron: '35 8 * * *'

permissions:
  contents: write
concurrency:
  group: fonta-r2-archive
  cancel-in-progress: false

jobs:
  regional-shadow:
    # Manual validation stays available while the scheduled circuit is OFF.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.FONTA_XEMA_DAILY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Congela previsió regional i contrasta només dies representatius
        env:
          FONTA_R2_ACCOUNT_ID: ${{ vars.FONTA_R2_ACCOUNT_ID }}
          FONTA_R2_ACCESS_KEY_ID: ${{ secrets.FONTA_R2_ACCESS_KEY_ID }}
          FONTA_R2_SECRET_ACCESS_KEY: ${{ secrets.FONTA_R2_SECRET_ACCESS_KEY }}
          REGIONAL_MODE: ${{ github.event_name == 'schedule' && 'run' || inputs.mode }}
        run: node scripts/fonta/collect-xema-daily.mjs "$REGIONAL_MODE" build/fonta-xema-daily
      - name: Resum sense lectures XEMA crues
        run: |
          echo '## Fonta regional — mode ombra privat' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build/fonta-xema-daily/receipt.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Obre la branca pública de seguiment sense copiar originals XEMA
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch fonta-data "https://github.com/${GITHUB_REPOSITORY}.git" build/fonta-public
      - name: Publica només comptadors operatius i salvaguardes
        run: node scripts/fonta/publish-regional-status.mjs build/fonta-xema-daily/receipt.json build/fonta-public/regional-status.json
      - name: Conserva l'estat públic sanititzat
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git -C build/fonta-public config user.name 'Fonta regional status'
          git -C build/fonta-public config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C build/fonta-public add -- regional-status.json
          if ! git -C build/fonta-public diff --cached --quiet; then
            git -C build/fonta-public commit -m 'Update sanitized Fonta regional status'
            git -C build/fonta-public pull --rebase origin fonta-data
            git -C build/fonta-public push origin HEAD:fonta-data
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: fonta-xema-daily-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/fonta-xema-daily/receipt.json
          if-no-files-found: error
          retention-days: 30
