name: YouTube Short · dues actualitzacions diàries

on:
  schedule:
    # Reserva estiu/hivern, quinze minuts després del disparador principal de
    # Cloudflare. El primer pas descarta automàticament el cron fora de temporada.
    - cron: '35 4 * * *'
    - cron: '35 5 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Franja que s'ha de preparar
        required: true
        default: mati
        type: choice
        options: [mati, vespre]
      privacy:
        description: Visibilitat del vídeo de prova
        required: true
        default: private
        type: choice
        options: [private, unlisted, public]
      schedule_publication:
        description: Programa'l a l'hora pública de la franja (només si encara hi ha marge)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: youtube-short-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ github.event_name == 'schedule' && 'private' || inputs.privacy || 'private' }}
      SHORT_SLOT: ${{ github.event_name == 'schedule' && (startsWith(github.event.schedule, '0 ') && 'vespre' || 'mati') || inputs.slot || 'mati' }}
      SHOULD_SCHEDULE_PUBLICATION: ${{ github.event_name == 'schedule' || inputs.schedule_publication }}
      YOUTUBE_SHORT_SHOULD_RUN: 'true'
      YOUTUBE_SHORT_COORDINATION_ACTIVE: 'false'
      SOCIAL_VIDEO_UPLOAD_URL: ${{ secrets.SOCIAL_VIDEO_UPLOAD_URL }}
      SOCIAL_VIDEO_UPLOAD_TOKEN: ${{ secrets.SOCIAL_VIDEO_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valida la finestra horària de reserva
        if: github.event_name == 'schedule'
        run: node scripts/youtube-backup-window.mjs >> "$GITHUB_ENV"
      - name: Coordina una sola execució per franja
        if: env.YOUTUBE_SHORT_SHOULD_RUN == 'true' && env.SOCIAL_VIDEO_UPLOAD_URL != '' && env.SOCIAL_VIDEO_UPLOAD_TOKEN != ''
        run: |
          set -euo pipefail
          case "$SHORT_SLOT" in
            mati|vespre) ;;
            *) echo "Franja de Short no vàlida" >&2; exit 1 ;;
          esac
          local_date="$(TZ=Europe/Madrid date +%F)"
          control_url="${SOCIAL_VIDEO_UPLOAD_URL%/admin/social-video-upload}/admin/youtube-short-runs/$local_date/$SHORT_SLOT"
          if curl --fail --silent --show-error --retry 2 --request POST \
            --header "Authorization: Bearer $SOCIAL_VIDEO_UPLOAD_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"action\":\"start\",\"source\":\"github-${GITHUB_EVENT_NAME}\"}" \
            --output /tmp/youtube-short-run.json "$control_url"; then
            should_run="$(node -e "const value=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')); process.stdout.write(value.shouldRun ? 'true' : 'false')" /tmp/youtube-short-run.json)"
            echo "YOUTUBE_SHORT_SHOULD_RUN=$should_run" >> "$GITHUB_ENV"
            echo "YOUTUBE_SHORT_COORDINATION_URL=$control_url" >> "$GITHUB_ENV"
            echo "YOUTUBE_SHORT_COORDINATION_ACTIVE=true" >> "$GITHUB_ENV"
          else
            echo "La coordinació amb el Worker encara no està activa; s'executa el flux normal." >&2
            echo "YOUTUBE_SHORT_SHOULD_RUN=true" >> "$GITHUB_ENV"
            echo "YOUTUBE_SHORT_COORDINATION_ACTIVE=false" >> "$GITHUB_ENV"
          fi
      - name: Instal·la el renderitzador
        if: env.YOUTUBE_SHORT_SHOULD_RUN == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg librsvg2-bin
      - name: Genera les pantalles amb dades reals
        id: generate
        if: env.YOUTUBE_SHORT_SHOULD_RUN == 'true'
        run: |
          node scripts/youtube-short.mjs
          node scripts/youtube-music.mjs
      - name: Programa l'hora pública del Short
        id: schedule
        if: env.YOUTUBE_SHORT_SHOULD_RUN == 'true' && env.SHOULD_SCHEDULE_PUBLICATION == 'true'
        run: node scripts/youtube-publish-at.mjs >> "$GITHUB_ENV"
      - name: Renderitza el Short vertical
        id: render
        if: env.YOUTUBE_SHORT_SHOULD_RUN == 'true'
        run: |
          for image in build/youtube-short/slide-*.svg; do rsvg-convert -w 2160 -h 3840 "$image" -o "${image%.svg}.png"; done
          for image in build/youtube-short/rain-frame-*.svg; do rsvg-convert -w 2160 -h 3840 "$image" -o "${image%.svg}.png"; done
          filter="[0:v]zoompan=z='min(zoom+0.00025,1.035)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=160:s=1080x1920:fps=30,trim=duration=5.32,setpts=PTS-STARTPTS[v0];[1:v]zoompan=z='min(zoom+0.00025,1.035)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=160:s=1080x1920:fps=30,trim=duration=5.32,setpts=PTS-STARTPTS[v1];[2:v]zoompan=z='min(zoom+0.00025,1.035)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=160:s=1080x1920:fps=30,trim=duration=5.32,setpts=PTS-STARTPTS[v2];[3:v]zoompan=z='min(zoom+0.00025,1.035)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=160:s=1080x1920:fps=30,trim=duration=5.32,setpts=PTS-STARTPTS[v3];[4:v]zoompan=z='min(zoom+0.00025,1.035)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=160:s=1080x1920:fps=30,trim=duration=5.32,setpts=PTS-STARTPTS[v4];[5:v]zoompan=z='min(zoom+0.00012,1.012)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=45:s=1080x1920:fps=30,trim=duration=1.48,setpts=PTS-STARTPTS[r0];[6:v]zoompan=z='min(zoom+0.00012,1.012)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=45:s=1080x1920:fps=30,trim=duration=1.48,setpts=PTS-STARTPTS[r1];[7:v]zoompan=z='min(zoom+0.00012,1.012)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=45:s=1080x1920:fps=30,trim=duration=1.48,setpts=PTS-STARTPTS[r2];[8:v]zoompan=z='min(zoom+0.00012,1.012)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=45:s=1080x1920:fps=30,trim=duration=1.48,setpts=PTS-STARTPTS[r3];[r0][r1]xfade=transition=fade:duration=0.2:offset=1.28[r01];[r01][r2]xfade=transition=fade:duration=0.2:offset=2.56[r02];[r02][r3]xfade=transition=fade:duration=0.2:offset=3.84[rain];[v0][v1]xfade=transition=fade:duration=0.4:offset=4.92[v01];[v01][v2]xfade=transition=fade:duration=0.4:offset=9.84[v02];[v02][v3]xfade=transition=fade:duration=0.4:offset=14.76[v03];[v03][v4]xfade=transition=fade:duration=0.4:offset=19.68[v04];[v04][rain]xfade=transition=fade:duration=0.4:offset=24.60[v]"
          ffmpeg -y -loop 1 -t 5.32 -i build/youtube-short/slide-1.png -loop 1 -t 5.32 -i build/youtube-short/slide-2.png -loop 1 -t 5.32 -i build/youtube-short/slide-3.png -loop 1 -t 5.32 -i build/youtube-short/slide-4.png -loop 1 -t 5.32 -i build/youtube-short/slide-5.png -loop 1 -t 1.48 -i build/youtube-short/rain-frame-1.png -loop 1 -t 1.48 -i build/youtube-short/rain-frame-2.png -loop 1 -t 1.48 -i build/youtube-short/rain-frame-3.png -loop 1 -t 1.48 -i build/youtube-short/rain-frame-4.png -i build/youtube-short/music.wav -filter_complex "$filter" -map "[v]" -map 9:a -r 30 -c:v libx264 -preset medium -profile:v high -level 4.1 -b:v 5M -minrate 5M -maxrate 5M -bufsize 10M -g 60 -keyint_min 60 -sc_threshold 0 -x264-params "nal-hrd=cbr:force-cfr=1:colorprim=bt709:transfer=bt709:colormatrix=bt709" -colorspace bt709 -color_primaries bt709 -color_trc bt709 -c:a aac -b:a 160k -shortest -pix_fmt yuv420p -movflags +faststart -t 30 build/youtube-short/short.mp4
          ffprobe -v error -show_entries format=duration,size -of json build/youtube-short/short.mp4
      - name: Conserva una previsualització
        if: env.YOUTUBE_SHORT_SHOULD_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meteo-fontanillas-short-preview
          path: build/youtube-short/short.mp4
          retention-days: 7
      - name: Desa una còpia privada per a una Story futura
        id: social_video_upload
        if: env.YOUTUBE_SHORT_SHOULD_RUN == 'true' && env.SOCIAL_VIDEO_UPLOAD_URL != '' && env.SOCIAL_VIDEO_UPLOAD_TOKEN != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          case "$SHORT_SLOT" in
            mati) video_slot=morning ;;
            vespre) video_slot=evening ;;
            *) echo "Franja de Short no vàlida" >&2; exit 1 ;;
          esac
          local_date="$(TZ=Europe/Madrid date +%F)"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $SOCIAL_VIDEO_UPLOAD_TOKEN" \
            --header "Content-Type: video/mp4" \
            --header "Content-Length: $(wc -c < build/youtube-short/short.mp4 | tr -d ' ')" \
            --data-binary @build/youtube-short/short.mp4 \
            "$SOCIAL_VIDEO_UPLOAD_URL/shorts/$local_date/$video_slot.mp4"
      - name: Puja el vídeo a YouTube
        id: youtube_upload
        if: env.YOUTUBE_SHORT_SHOULD_RUN == 'true'
        run: node scripts/youtube-upload.mjs
      - name: Deixa el TikTok preparat a Buffer
        if: steps.youtube_upload.outcome == 'success' && steps.social_video_upload.outcome == 'success' && env.YOUTUBE_SHORT_SHOULD_RUN == 'true' && env.SOCIAL_VIDEO_UPLOAD_URL != '' && env.SOCIAL_VIDEO_UPLOAD_TOKEN != ''
        run: |
          set -euo pipefail
          case "$SHORT_SLOT" in
            mati) video_slot=morning ;;
            vespre) video_slot=evening ;;
            *) echo "Franja de Short no vàlida" >&2; exit 1 ;;
          esac
          local_date="$(TZ=Europe/Madrid date +%F)"
          base_url="${SOCIAL_VIDEO_UPLOAD_URL%/admin/social-video-upload}"
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $SOCIAL_VIDEO_UPLOAD_TOKEN" \
            "$base_url/admin/buffer-tiktok/schedule/$local_date/$video_slot"
      - name: Deixa el vídeo d’X preparat a Buffer
        if: steps.social_video_upload.outcome == 'success' && env.YOUTUBE_SHORT_SHOULD_RUN == 'true' && env.SOCIAL_VIDEO_UPLOAD_URL != '' && env.SOCIAL_VIDEO_UPLOAD_TOKEN != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          case "$SHORT_SLOT" in
            mati) video_slot=morning ;;
            vespre) video_slot=evening ;;
            *) echo "Franja de Short no vàlida" >&2; exit 1 ;;
          esac
          local_date="$(TZ=Europe/Madrid date +%F)"
          base_url="${SOCIAL_VIDEO_UPLOAD_URL%/admin/social-video-upload}"
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $SOCIAL_VIDEO_UPLOAD_TOKEN" \
            "$base_url/admin/buffer-x/schedule/$local_date/$video_slot"
      - name: Confirma la franja completada
        if: always() && steps.youtube_upload.outcome == 'success' && env.YOUTUBE_SHORT_SHOULD_RUN == 'true' && env.YOUTUBE_SHORT_COORDINATION_ACTIVE == 'true'
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --retry 2 --request POST \
            --header "Authorization: Bearer $SOCIAL_VIDEO_UPLOAD_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"action\":\"complete\",\"source\":\"github-${GITHUB_EVENT_NAME}\"}" \
            "$YOUTUBE_SHORT_COORDINATION_URL"
      - name: Allibera la franja fallida perquè Cloudflare la reintenti
        if: always() && steps.youtube_upload.outcome != 'success' && env.YOUTUBE_SHORT_SHOULD_RUN == 'true' && env.YOUTUBE_SHORT_COORDINATION_ACTIVE == 'true'
        continue-on-error: true
        run: |
          if [ "${{ steps.generate.outcome }}" = "failure" ]; then
            failure_stage="forecast-api"
            failure_message="No s’han pogut obtenir les dades meteorològiques per generar el vídeo."
          elif [ "${{ steps.schedule.outcome }}" = "failure" ]; then
            failure_stage="publication-time"
            failure_message="No s’ha pogut calcular l’hora pública del vídeo."
          elif [ "${{ steps.render.outcome }}" = "failure" ]; then
            failure_stage="video-render"
            failure_message="No s’ha pogut renderitzar el vídeo vertical."
          elif [ "${{ steps.youtube_upload.outcome }}" = "failure" ]; then
            failure_stage="youtube-upload"
            failure_message="YouTube ha rebutjat o no ha completat la pujada del vídeo."
          else
            failure_stage="github-workflow"
            failure_message="La preparació del Short no s’ha completat."
          fi
          curl --fail --silent --show-error --retry 2 --request POST \
            --header "Authorization: Bearer $SOCIAL_VIDEO_UPLOAD_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"action\":\"fail\",\"source\":\"github-${GITHUB_EVENT_NAME}\",\"stage\":\"${failure_stage}\",\"error\":\"${failure_message}\"}" \
            "$YOUTUBE_SHORT_COORDINATION_URL"
