name: Fonta · laboratori independent (sense publicacions)

on:
  workflow_dispatch:
  schedule:
    # Multiple daytime opportunities tolerate delayed GitHub cron delivery.
    # collect.mjs keeps at most one create-only AM capture per UTC day.
    - cron: '17 8,10,12,14,16,20 * * *'

# Activation is separate from merge. No social or Cloudflare secrets.
permissions:
  contents: write
concurrency:
  group: fonta-shadow-archive
  cancel-in-progress: false

jobs:
  capture:
    if: vars.FONTA_SHADOW_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Descarta una execució endarrerida abans de les 08 UTC
        id: capture_window
        shell: bash
        run: |
          if [ "$(date -u +%H)" -lt 8 ]; then
            echo 'capture=false' >> "$GITHUB_OUTPUT"
            echo 'Fonta: fora de la finestra de captura; no es reserva el matí.'
          else
            echo 'capture=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Obre l'arxiu independent sense canviar main
        if: steps.capture_window.outputs.capture == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          existing="$(git ls-remote --heads "$remote" refs/heads/fonta-data)"
          if [ -n "$existing" ]; then
            git clone --depth=1 --single-branch --branch fonta-data "$remote" build/fonta-data
          else
            mkdir -p build/fonta-data
            git -C build/fonta-data init -b fonta-data
            git -C build/fonta-data remote add origin "$remote"
          fi
      - name: Captura dades públiques (sis fonts i un reintent per error transitori; AROME HD només en ombra)
        if: steps.capture_window.outputs.capture == 'true'
        id: collect
        continue-on-error: true
        run: node scripts/fonta/collect.mjs build/fonta-data
      - name: Recalcula l'avaluació sense promocionar cap model
        if: steps.capture_window.outputs.capture == 'true'
        run: node scripts/fonta/report.mjs build/fonta-data
      - name: Conserva captures i informe a fonta-data
        if: steps.capture_window.outputs.capture == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git -C build/fonta-data config user.name 'Fonta shadow archive'
          git -C build/fonta-data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C build/fonta-data add -- '*.json'
          if ! git -C build/fonta-data diff --cached --quiet; then
            git -C build/fonta-data commit -m 'Archive Fonta shadow capture and evaluation'
            bash scripts/ci/push-fonta-data-with-retry.sh build/fonta-data
          fi
      - name: Assenyala una captura degradada o pressupost esgotat
        if: steps.capture_window.outputs.capture == 'true' && steps.collect.outcome == 'failure'
        run: exit 1
